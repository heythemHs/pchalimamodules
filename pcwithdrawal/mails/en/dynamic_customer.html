<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{shop_name} — Withdrawal Request</title>
<style>
  body { margin:0; padding:0; background:#f4f4f4; font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#333333; }
  .email-wrapper { width:100%; background:#f4f4f4; padding:20px 0; }
  .email-container { max-width:600px; margin:0 auto; background:#ffffff; border:1px solid #dddddd; border-radius:4px; overflow:hidden; }
  .email-header { background:#003366; padding:20px 30px; text-align:center; }
  .email-header img { max-height:50px; }
  .email-header .shop-name { color:#ffffff; font-size:18px; font-weight:bold; margin-top:8px; }
  .email-body { padding:30px; }
  .email-footer { background:#f9f9f9; border-top:1px solid #eeeeee; padding:16px 30px; font-size:12px; color:#888888; text-align:center; }
  .email-footer a { color:#888888; }
</style>
</head>
<body>
<div class="email-wrapper">
  <table class="email-container" cellpadding="0" cellspacing="0" role="presentation" width="600" align="center">
    <tr>
      <td class="email-header">
        {if isset($shop_logo)}<img src="{shop_logo}" alt="{shop_name}"><br>{/if}
        <div class="shop-name">{shop_name}</div>
      </td>
    </tr>
    <tr>
      <td class="email-body">
        {dynamic_html_content}
      </td>
    </tr>
    <tr>
      <td class="email-footer">
        <p>&copy; {shop_name} &mdash; {shop_url}</p>
        <p>This message was sent regarding a withdrawal request submitted through our website.</p>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
